name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Environnement cible"
        required: true
        default: "prod"
        type: choice
        options: [dev, prod]

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
  SA_KEY_PATH: /tmp/gcp-sa.json

jobs:

  # ── 1. Lint SQL (PR uniquement) ───────────────────────────────────────────
  lint:
    name: "SQL Lint"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer sqlfluff + dbt-bigquery
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-bigquery --quiet

      - name: Lint des modèles SQL
        run: sqlfluff lint models/ --dialect bigquery --templater dbt

  # ── 2. Build dev (PR uniquement) ──────────────────────────────────────────
  build-dev:
    name: "dbt build (dev)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4  # ✅ Récupère TOUT le code, y compris seeds/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      # ❌ SUPPRIMÉ : download-artifact (inutile)

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PROFILES_YML: |
            brasil_dbt:
              target: dev
              outputs:
                dev:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_dev
                  location: EU
                  threads: 4
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: Vérifier les seeds
        run: |
          if [ -d "seeds" ]; then
            echo "✅ Dossier seeds/ trouvé"
            ls -lh seeds/
          else
            echo "⚠️ Aucun dossier seeds/ - dbt seed sera ignoré"
          fi

      - name: dbt debug
        run: dbt debug --target dev

      - name: dbt seed
        run: dbt seed --target dev || echo "Pas de seeds à charger"

      - name: dbt run
        run: dbt run --target dev

  # ── 3. Test dev (PR uniquement) ───────────────────────────────────────────
  test-dev:
    name: "dbt test (dev)"
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PROFILES_YML: |
            brasil_dbt:
              target: dev
              outputs:
                dev:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_dev
                  location: EU
                  threads: 4
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: dbt test
        run: dbt test --target dev

  # ── 4. Deploy prod (push sur main ou workflow_dispatch) ───────────────────
  deploy-prod:
    name: "dbt deploy (prod)"
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    steps:
      - uses: actions/checkout@v4  # ✅ Récupère TOUT le code, y compris seeds/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      # ❌ SUPPRIMÉ : download-artifact (inutile)

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PROFILES_YML: |
            brasil_dbt:
              target: prod
              outputs:
                prod:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_prod
                  location: EU
                  threads: 8
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: Vérifier les seeds
        run: |
          if [ -d "seeds" ]; then
            echo "✅ Dossier seeds/ trouvé"
            ls -lh seeds/
          else
            echo "⚠️ Aucun dossier seeds/ - dbt seed sera ignoré"
          fi

      - name: dbt debug
        run: dbt debug --target prod

      - name: dbt seed
        run: dbt seed --target prod || echo "Pas de seeds à charger"

      - name: dbt run
        run: dbt run --target prod

      - name: dbt test
        run: dbt test --target prod

      - name: dbt docs generate
        run: dbt docs generate --target prod

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/
          retention-days: 7