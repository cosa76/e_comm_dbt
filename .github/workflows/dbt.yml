name: dbt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:           # déclenchement manuel depuis GitHub UI
    inputs:
      target:
        description: "Environnement cible"
        required: true
        default: "prod"
        type: choice
        options: [dev, prod]

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt
  SA_KEY_PATH: /tmp/gcp-sa.json

# ══════════════════════════════════════════════════════════════════════════════
#  JOBS
# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── 1. Collecte des seeds depuis le projet ─────────────────────────────────
  generate:
    name: "Collect seeds"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les seeds existants
        run: |
          if [ -d "seeds" ]; then
            ls -1 seeds/*.csv || echo "Aucun fichier CSV trouvé dans seeds/"
          else
            echo "Le dossier seeds/ n'existe pas."
          fi

      - name: Publier les seeds en artifact
        uses: actions/upload-artifact@v4
        with:
          name: seeds
          path: seeds/*.csv
          retention-days: 1
          if-no-files-found: ignore

  # ── 2. Lint SQL ───────────────────────────────────────────────────────────
  lint:
    name: "SQL Lint"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer sqlfluff + dbt-bigquery
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-bigquery --quiet

      - name: Lint des modèles SQL
        run: sqlfluff lint models/ --dialect bigquery --templater dbt

  # ── 3. Build dev ──────────────────────────────────────────────────────────
  build-dev:
    name: "dbt build (dev)"
    runs-on: ubuntu-latest
    needs: generate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      - name: Récupérer les CSV seeds
        uses: actions/download-artifact@v4
        with:
          name: seeds
          path: seeds/

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          # ✅ Astuce : On définit le YAML dans une variable d'env GitHub Actions
          PROFILES_YML: |
            brasil_dbt:
              target: dev
              outputs:
                dev:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_dev
                  location: EU
                  threads: 4
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          # ✅ On écrit simplement la variable dans le fichier
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: dbt debug
        run: dbt debug --target dev

      - name: dbt seed
        run: dbt seed --target dev

      - name: dbt run
        run: dbt run --target dev

  # ── 4. Test dev ───────────────────────────────────────────────────────────
  test-dev:
    name: "dbt test (dev)"
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PROFILES_YML: |
            brasil_dbt:
              target: dev
              outputs:
                dev:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_dev
                  location: EU
                  threads: 4
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: dbt test
        run: dbt test --target dev

  # ── 5. Deploy prod (push sur main uniquement) ─────────────────────────────
  deploy-prod:
    name: "dbt deploy (prod)"
    runs-on: ubuntu-latest
    needs: generate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer dbt-bigquery
        run: pip install dbt-bigquery --quiet

      - name: Récupérer les CSV générés
        uses: actions/download-artifact@v4
        with:
          name: seeds
          path: seeds/

      - name: Écrire credentials GCP + profiles dbt
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PROFILES_YML: |
            brasil_dbt:
              target: prod
              outputs:
                prod:
                  type: bigquery
                  method: service-account
                  project: ${{ secrets.GCP_PROJECT_ID }}
                  keyfile: ${{ env.SA_KEY_PATH }}
                  dataset: e_com_prod
                  location: EU
                  threads: 8
                  timeout_seconds: 300
        run: |
          echo "$SA_JSON" > ${{ env.SA_KEY_PATH }}
          mkdir -p .dbt
          echo "$PROFILES_YML" > .dbt/profiles.yml

      - name: dbt debug
        run: dbt debug --target prod

      - name: dbt seed
        run: dbt seed --target prod

      - name: dbt run
        run: dbt run --target prod

      - name: dbt test
        run: dbt test --target prod

      - name: dbt docs generate
        run: dbt docs generate --target prod

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/
          retention-days: 7