version: 2

sources:
  - name: olist
    description: "Dataset public e-commerce brésilien Olist (2016-2018)"
    schema: e_com_dev
    tables:
      - name: customers
        identifier: olist_customers
        description: "Informations sur les clients Olist"
        columns:
          - name: customer_id
            description: "Clé primaire — identifiant unique de l'instance client dans une commande"
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            description: "Identifiant unique du client (peut avoir plusieurs customer_id)"
            tests:
              - not_null
          - name: customer_zip_code_prefix
            tests: [not_null]
          - name: customer_city
            tests: [not_null]
          - name: customer_state
            tests: [not_null]

      - name: geolocation
        identifier: olist_geolocation
        description: "Coordonnées géographiques par code postal brésilien"
        columns:
          - name: geolocation_zip_code_prefix
            tests: [not_null]
          - name: geolocation_lat
            tests: [not_null]
          - name: geolocation_lng
            tests: [not_null]

      - name: order_items
        identifier: olist_order_items
        description: "Lignes de commande : produit, vendeur, prix et frais de port"
        columns:
          - name: order_id
            tests: [not_null]
          - name: order_item_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]
          - name: seller_id
            tests: [not_null]
          - name: price
            tests: [not_null]
          - name: freight_value
            tests: [not_null]

      - name: order_payments
        identifier: olist_order_payments
        description: "Paiements associés aux commandes (plusieurs modes possibles)"
        columns:
          - name: order_id
            tests: [not_null]
          - name: payment_sequential
            tests: [not_null]
          - name: payment_type
            tests:
              - not_null
              - accepted_values:
                  values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
          - name: payment_value
            tests: [not_null]

      - name: order_reviews
        identifier: olist_order_reviews
        description: "Avis clients sur les commandes"
        columns:
          - name: review_id
            tests: [not_null]
          - name: order_id
            tests: [not_null]
          - name: review_score
            tests:
              - not_null
             # - accepted_values:
             #     values: [1, 2, 3, 4, 5]
             #     quotes: false

      - name: orders
        identifier: olist_orders
        description: "Commandes Olist avec statut et dates clés"
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests: [not_null]
          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'approved', 'created']

      - name: products
        identifier: olist_products
        description: "Catalogue produits Olist"
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: sellers
        identifier: olist_sellers
        description: "Vendeurs enregistrés sur la plateforme Olist"
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null

      - name: product_category_name_translation
        identifier: product_category_name_translation
        description: "Traduction des catégories produit du portugais vers l'anglais"
        columns:
          - name: product_category_name
            tests:
              - unique
              - not_null
          - name: product_category_name_english
            tests: [not_null]
