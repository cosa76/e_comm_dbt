version: 2

models:
  - name: stg_customers
    description: "Clients Olist — renommage et normalisation des colonnes source"
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
      - name: zip_code_prefix
        tests: [not_null]
      - name: city
        tests: [not_null]
      - name: state
        tests: [not_null]

  - name: stg_geolocation
    description: "Coordonnées géographiques par code postal — peut contenir des doublons de zip_code_prefix"
    columns:
      - name: zip_code_prefix
        tests: [not_null]
      - name: lat
        tests: [not_null]
      - name: lng
        tests: [not_null]

  - name: stg_order_items
    description: "Lignes de commande avec cast des dates"
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: seller_id
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: freight_value
        tests: [not_null]

  - name: stg_order_payments
    description: "Paiements par commande — une commande peut avoir plusieurs lignes"
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_sequential
        tests: [not_null]
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_value
        tests: [not_null]

  - name: stg_order_reviews
    description: "Avis clients avec cast des timestamps"
    columns:
      - name: review_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: review_score
        tests:
          - not_null
        #  - accepted_values:
        #      values: [1, 2, 3, 4, 5]
        #      quotes: false

  - name: stg_orders
    description: "Commandes avec tous les statuts et dates clés castées en timestamp"
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'approved', 'created']

  - name: stg_products
    description: "Produits avec correction de la faute de frappe 'lenght' → 'length'"
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_sellers
    description: "Vendeurs Olist avec normalisation des colonnes"
    columns:
      - name: seller_id
        tests: [unique, not_null]

  - name: stg_product_category_translations
    description: "Traduction portugais → anglais des catégories produit, BOM nettoyé"
    columns:
      - name: product_category_name
        tests: [unique, not_null]
      - name: product_category_name_english
        tests: [not_null]
